<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İnceleme Gönder</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; }
        .container { width: 50%; margin: 50px auto; background-color: #1f1f1f; padding: 30px; border-radius: 8px; border: 1px solid #b8860b; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 10px; margin-bottom: 20px; background-color: #333; color: white; border: none; border-radius: 4px; }
        button { background-color: #b8860b; color: black; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; width: 100%; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Dizi İncelemesi Gönder</h2>
        <form action="inceleme_kaydet.php" method="POST">
            <label>Dizi Adı:</label>
            <input type="text" name="dizi_adi" required>

            <label>Puanınız (1-10):</label>
            <input type="number" name="puan" min="1" max="10" required>

            <label>Yorumunuz:</label>
            <textarea name="yorum" rows="4" required></textarea>

            <button type="submit">Gönder</button>
        </form>
        <br>
        <a href="index.php" style="color:#b8860b;">Ana Sayfaya Dön</a>
    </div>
</body>
</html>
